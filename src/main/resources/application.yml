spring:
  application:
    name: hhplus-ecommerce

  # Database Configuration (MySQL)
  datasource:
    url: jdbc:mysql://localhost:9910/ecommerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: hhplus
    password: hhplus1234
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        use_sql_comments: true
    open-in-view: false

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 9911
      password:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          max-wait: -1ms

# Redisson Configuration
spring.redis.redisson:
  config: |
    singleServerConfig:
      address: "redis://localhost:9911"
      connectionPoolSize: 64
      connectionMinimumIdleSize: 10
      idleConnectionTimeout: 10000
      connectTimeout: 10000
      timeout: 3000
      retryAttempts: 3
      retryInterval: 1500

server:
  port: 8080

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Logging
logging:
  level:
    root: INFO
    com.hhplus: DEBUG
    p6spy: INFO

# P6Spy Configuration
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j